# AI优选零食 —— nginx 反向代理配置
#
# 用途：把「公网域名 + HTTPS」转到本机 3100 端口上的后端。
# 后端自己就托管管理后台（hash 路由），所以这里**不需要** history 回退规则。
#
# 用法：
#   1. 把 your-domain.com 全部替换成你的真实域名
#   2. cp deploy/nginx.conf /etc/nginx/sites-available/campus
#      ln -s /etc/nginx/sites-available/campus /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#
# 证书用 certbot 自动申请：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d your-domain.com
#   （certbot 会自动改写下面 443 的证书路径，并把 80 段改成跳转）

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 微信要求「服务器域名」必须是 HTTPS，所以 80 一律跳过去
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 商品图上传走 base64 JSON，后端放宽到 8mb，nginx 默认 1m 会先拦下来
    client_max_body_size 20m;

    access_log /var/log/nginx/campus.access.log;
    error_log  /var/log/nginx/campus.error.log;

    # ============================================================
    # AI 流式对话 —— 整个配置里最关键的一段
    #
    # 这是 SSE（Server-Sent Events）长连接。nginx 默认会把响应缓冲起来，
    # 攒够一个缓冲区才发给客户端 —— 结果就是小程序的「逐字输出」变成
    # 「卡好几秒，然后一次性全出来」，甚至直接超时断开。
    #
    # 三个开关缺一不可：proxy_buffering off / gzip off / 长 timeout。
    # ============================================================
    location = /api/ai/chat {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';   # 关掉 keep-alive 复用，SSE 才能长驻

        proxy_buffering off;      # 不缓冲：模型吐一个字就转一个字
        proxy_cache     off;
        gzip            off;      # gzip 会攒够一块才发，同样破坏流式
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s; # 一次对话可能跑很久
        proxy_send_timeout 3600s;
    }

    # 其余全部（管理后台页面 / 普通接口 / 商品图）
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
    }
}
